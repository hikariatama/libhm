name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all"'
      - name: Test draft release lifecycle
        run: python3 -m unittest discover -s scripts -p 'test_publish_draft.py'

  check:
    name: Checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test application
        run: >-
          xcodebuild -project PhotoAtlas.xcodeproj -scheme PhotoAtlas
          -configuration Release -derivedDataPath "$RUNNER_TEMP/libhm-tests"
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Check source tree
        run: git diff --exit-code

  build:
    name: Build · macOS universal
    needs: [check, secrets]
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Configure build paths
        run: |
          echo "PHOTO_ATLAS_DERIVED_DATA=$RUNNER_TEMP/libhm-build" >> "$GITHUB_ENV"
          echo "LIBHM_DMG_VENV=$RUNNER_TEMP/libhm-dmg-venv" >> "$GITHUB_ENV"
      - name: Build application
        working-directory: app
        run: ./scripts/build-run.sh --build-only
      - name: Package DMG
        working-directory: app
        run: ./scripts/package-dmg.sh "$PHOTO_ATLAS_DERIVED_DATA/Build/Products/Release/libhm.app" "$RUNNER_TEMP/libhm.dmg"
      - name: Collect release packages
        run: |
          mkdir -p "$RUNNER_TEMP/distribution"
          cp "$RUNNER_TEMP/libhm.dmg" "$RUNNER_TEMP/distribution/libhm-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$PHOTO_ATLAS_DERIVED_DATA/Build/Products/Release/libhm.app" "$RUNNER_TEMP/distribution/libhm-macos-universal.zip"
      - name: Check source tree
        run: git diff --exit-code
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libhm-macos-universal
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  release:
    name: Draft release
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: draft-release
      cancel-in-progress: false
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Replace version draft and its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-draft.py artifacts
