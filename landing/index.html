<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>libhm</title>
    <meta name="description" content="A photo map for Apple Photos. See where your photos were taken and open the ones from any place." />
    <link rel="icon" type="image/png" href="assets/icon-64.png?v=ios-20261026" />
    <link rel="apple-touch-icon" href="assets/icon.png?v=ios-20261026" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body class="site-body">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M12.8 12.8 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
        <symbol id="i-sidebar" viewBox="0 0 20 20"><rect x="2.3" y="3.8" width="15.4" height="12.4" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M7.6 4v12M4.4 7h1.4M4.4 9.3h1.4M4.4 11.6h1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></symbol>
        <symbol id="i-help" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="M7.7 7.9a2.35 2.35 0 1 1 3.4 2.1c-.7.36-1.1.85-1.1 1.6v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /><circle cx="10" cy="14.2" r=".95" fill="currentColor" /></symbol>
        <symbol id="i-filter" viewBox="0 0 20 20"><path d="M3 5.5h14M5.6 10h8.8M8.2 14.5h3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></symbol>
        <symbol id="i-share" viewBox="0 0 20 20"><path d="M7 8H5.6a1.6 1.6 0 0 0-1.6 1.6v6.2a1.6 1.6 0 0 0 1.6 1.6h8.8a1.6 1.6 0 0 0 1.6-1.6V9.6A1.6 1.6 0 0 0 14.4 8H13M10 12V2.6M7 5.4l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-map" viewBox="0 0 20 20"><path d="M2.5 5.2 7.2 3.4v11.4l-4.7 1.8zM8.4 3.4l4.2 1.8v11.4l-4.2-1.8zM13.8 5.2l3.7-1.8v11.4l-3.7 1.8z" fill="currentColor" /></symbol>
        <symbol id="i-fit" viewBox="0 0 20 20"><path d="M4 9V4h5M16 11v5h-5M4.3 4.3l11.4 11.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
        <symbol id="i-minus" viewBox="0 0 20 20"><path d="M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
        <symbol id="i-back" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="M10 9v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /><circle cx="10" cy="6.4" r=".95" fill="currentColor" /></symbol>
        <symbol id="i-heart" viewBox="0 0 20 20"><path d="M10 16.4S3 12.3 3 7.6A3.6 3.6 0 0 1 10 6.2a3.6 3.6 0 0 1 7 1.4c0 4.7-7 8.8-7 8.8z" fill="currentColor" /></symbol>
        <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-zoomout" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M12.6 12.6 16.5 16.5M6.2 8.5h4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></symbol>
        <symbol id="i-zoomin" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M12.6 12.6 16.5 16.5M6.2 8.5h4.6M8.5 6.2v4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></symbol>
        <symbol id="i-pin" viewBox="0 0 20 20"><path d="M10 18s-5.5-5.4-5.5-9.6a5.5 5.5 0 0 1 11 0C15.5 12.6 10 18 10 18z" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="10" cy="8.4" r="2" fill="currentColor" /></symbol>
      </defs>
    </svg>

    <main class="page site-page">
      <header class="header site-header">
        <img class="icon site-icon" src="assets/icon.png?v=ios-20261026" alt="" width="52" height="52" />
        <div class="title site-title">
          <h1>libhm</h1>
          <p>A photo map for Apple Photos. See where your photos were taken and open the ones from any place.</p>
        </div>
        <nav class="actions site-actions">
          <!-- Placeholder URLs for the build and repository. -->
          <a class="site-button primary" href="https://github.com/hikariatama/libhm/releases/latest/download/libhm-macos-universal.dmg">Download for macOS</a>
          <a class="site-button" href="https://github.com/hikariatama/libhm">GitHub</a>
        </nav>
      </header>

      <section class="stage site-stage" id="stage" aria-label="libhm next to the Photos library it reads">
        <!-- Mirrors app/Sources/PhotoAtlas/ContentView.swift: floating panel, map controls, legend, viewer. -->
        <div class="window site-demo" id="window">
          <div class="map" id="map"></div>
          <canvas class="heat" id="heat"></canvas>
          <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>

          <section class="panel glass" id="panel">
            <div class="panel-head">
              <div class="row">
                <div class="search" id="search">
                  <svg><use href="#i-search" /></svg>
                  <input type="text" id="search-input" placeholder="Search places" aria-label="Search places" autocomplete="off" spellcheck="false" />
                  <div class="results glass" id="search-results" role="listbox" hidden></div>
                </div>
                <button class="icon-btn secondary" id="toggle-gallery" aria-label="Collapse photo gallery"><svg><use href="#i-sidebar" /></svg></button>
              </div>
              <div class="row brand">
                <img src="assets/wordmark-dark.svg" width="58" height="25" alt="libhm" />
                <span class="spacer"></span>
                <span class="icon-btn small" aria-hidden="true"><svg><use href="#i-help" /></svg></span>
                <span class="icon-btn small" aria-hidden="true"><svg><use href="#i-filter" /></svg></span>
                <span class="icon-btn small" aria-hidden="true"><svg><use href="#i-share" /></svg></span>
              </div>
            </div>
            <div class="gallery-head">
              <div class="row baseline">
                <h2 id="area-title">In this area</h2>
                <span class="count" id="area-count">0</span>
              </div>
              <button class="link" id="back-to-area" hidden>Back to map area</button>
            </div>
            <div class="gallery" id="gallery"></div>
          </section>

          <div class="controls">
            <div class="group glass">
              <button class="icon-btn ctl" id="map-menu-btn" aria-label="Map appearance" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-map" /></svg></button>
              <hr />
              <button class="icon-btn ctl" id="fit" aria-label="Show all photos"><svg><use href="#i-fit" /></svg></button>
            </div>
            <div class="group glass">
              <button class="icon-btn ctl" id="zoom-in" aria-label="Zoom in"><svg><use href="#i-plus" /></svg></button>
              <hr />
              <button class="icon-btn ctl" id="zoom-out" aria-label="Zoom out"><svg><use href="#i-minus" /></svg></button>
            </div>
          </div>
          <div class="menu glass" id="map-menu" role="menu" hidden>
            <button role="menuitemcheckbox" aria-checked="true" data-toggle="heatmap"><svg><use href="#i-check" /></svg>Heatmap</button>          </div>

          <div class="legend glass" id="legend"><span>Fewer</span><i></i><span>More photos</span></div>

          <section class="viewer" id="viewer" hidden aria-label="Photo viewer">
            <div class="viewer-bar">
              <div class="group glass">
                <button class="icon-btn vb" id="viewer-back" aria-label="Back to map"><svg><use href="#i-back" /></svg></button>
                <span class="zoom">
                  <svg aria-hidden="true"><use href="#i-zoomout" /></svg>
                  <input type="range" id="viewer-zoom" min="1" max="8" step="0.01" value="1" aria-label="Zoom" />
                  <svg aria-hidden="true"><use href="#i-zoomin" /></svg>
                </span>
              </div>
              <div class="title-block">
                <strong id="viewer-date"></strong>
                <span id="viewer-pos"></span>
              </div>
              <div class="group glass">
                <span class="icon-btn vb fav" id="viewer-fav" aria-label="Favorite"><svg><use href="#i-heart" /></svg></span>
                <button class="icon-btn vb" id="viewer-info-btn" aria-label="Info" aria-expanded="false"><svg><use href="#i-info" /></svg></button>
              </div>
            </div>
            <div class="viewer-stage" id="viewer-stage"><img class="photo" id="viewer-photo" alt="" draggable="false" /></div>
            <dl class="info glass" id="viewer-info" hidden></dl>
          </section>
        </div>

        <div class="cursor" id="cursor" aria-hidden="true">
          <svg viewBox="0 0 16 22" width="16" height="22"><path d="M1 1v17l4.5-4.2 3 6.7 2.8-1.2-3-6.6H14z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round" /></svg>
        </div>
      </section>

      <footer class="footer site-footer">
        <a class="avx" href="https://avx.so"><img src="assets/avx.svg" alt="avx.so" width="67" height="13" /></a>
        <span>
          <a href="https://github.com/hikariatama/libhm/blob/main/LICENSE">AGPL-3.0</a> · Photos from <a href="photos/CREDITS.md">Unsplash</a> · Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://openfreemap.org">OpenFreeMap</a>
        </span>
      </footer>
    </main>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="photos.js"></script>
    <script src="main.js"></script>
  </body>
</html>
